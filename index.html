<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KALAY ART PLP Editor</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#111;
color:white;
}

.toolbar{
display:flex;
gap:5px;
padding:10px;
background:#222;
flex-wrap:wrap;
}

button,input{
padding:8px;
}

#canvasWrap{
display:flex;
justify-content:center;
margin-top:10px;
}

canvas{
border:2px solid orange;
}
</style>
</head>

<body>

<div class="toolbar">

<button onclick="addText()">Text</button>

<input type="file" id="imageInput">

<input type="file" id="fontInput">

<button onclick="savePLP()">Save PLP</button>

<input type="file" id="openPLP">

<button onclick="exportPNG()">PNG</button>

</div>

<div id="canvasWrap">
<canvas id="editor" width="1080" height="1080"></canvas>
</div>

<script>

const canvas = new fabric.Canvas("editor");

canvas.backgroundColor = "#ffffff";

canvas.renderAll();

function addText(){

let txt = new fabric.Textbox(
"જય શ્રી રામ",
{
left:200,
top:200,
fontSize:60,
fill:"#ff6600"
}
);

canvas.add(txt);

}

document.getElementById("imageInput")
.addEventListener("change",e=>{

let file=e.target.files[0];

let reader=new FileReader();

reader.onload=function(f){

fabric.Image.fromURL(
f.target.result,
function(img){

img.scaleToWidth(300);

canvas.add(img);

}
);

};

reader.readAsDataURL(file);

});


async function savePLP(){

let json=canvas.toJSON();

let blob=new Blob(
[
JSON.stringify(json)
],
{
type:"application/json"
}
);

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="project.plp";

a.click();

}

document.getElementById("openPLP")
.addEventListener("change",e=>{

let file=e.target.files[0];

let reader=new FileReader();

reader.onload=function(ev){

canvas.loadFromJSON(
ev.target.result,
function(){

canvas.renderAll();

}
);

};

reader.readAsText(file);

});

function exportPNG(){

let url=canvas.toDataURL({
format:"png"
});

let a=document.createElement("a");

a.href=url;

a.download="design.png";

a.click();

}

document.getElementById("fontInput")
.addEventListener("change",function(e){

let file=e.target.files[0];

if(!file) return;

let fontName=file.name.split(".")[0];

let fontURL=URL.createObjectURL(file);

let style=document.createElement("style");

style.innerHTML=`
@font-face{
font-family:'${fontName}';
src:url('${fontURL}');
}
`;

document.head.appendChild(style);

alert("Font Loaded: "+fontName);

});

</script>

</body>
</html>
